dependencies:
  animate_do: ^5.1.0
  firebase_analytics: ^12.4.3
  firebase_auth: ^6.5.3
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  google_sign_in: ^7.2.0
  animations: ^2.1.1
  csv: ^8.0.0
  dartz: ^0.10.1
  dio: ^5.9.0
  equatable: ^2.0.7
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  formz: ^0.8.0
  gap: ^3.0.1
  get_it: ^9.1.0
