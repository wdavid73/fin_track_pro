  yaml: ^3.1.2
  fake_cloud_firestore: ^4.1.1

patrol:
  test_directory: integration_test

flutter:
  uses-material-design: true

  # Internalization
  generate: true

  # Environment files loaded via flutter_dotenv
  # These files are optional - if missing, fallback values are used
  # In CI/CD, warnings about missing files are expected and safe to ignore
  assets:
    - .env.dev
    - .env.staging
    - .env.prod
