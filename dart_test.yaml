tags:
  # Tag usado por Alchemist para identificar y filtrar tests visuales.
  # Alchemist aplica este tag automáticamente a todos los goldenTest().
  # Registrarlo aquí elimina el warning "A tag was used that wasn't specified".
  #
  # Puedes ejecutar solo golden tests con:
  #   fvm flutter test --tags golden
  # O excluirlos con:
  #   fvm flutter test --exclude-tags golden
  golden: {}
