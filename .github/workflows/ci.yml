name: Flutter CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 🔥 Cache Pub dependencies
      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      # 🔨 Generate code (Hive adapters, Injectable, etc.)
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify CI works without .env files
        run: |
          if [ -f .env ] || [ -f .env.dev ] || [ -f .env.staging ] || [ -f .env.prod ]; then
            echo "❌ .env files should not exist in CI"
            exit 1
          fi
          echo "✅ No .env files - using fallback values"

      # ⚡ Analyze sin pub get
      # Note: Warnings about missing .env files are expected and safe in CI
      - name: Analyze code
        run: flutter analyze --no-pub --suppress-analytics 2>&1 | grep -v "asset_does_not_exist" || flutter analyze --no-pub

      - name: Create empty env files
        run: |
          touch .env.dev
          touch .env.staging
          touch .env.prod

      # ⚡ Tests sin pub get
      - name: Run tests
        run: flutter test --no-pub --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # 📊 Generate coverage summary for PR comments
      - name: Generate Coverage Report
        if: github.event_name == 'pull_request'
        run: |
          if [ -f coverage/lcov.info ]; then
            # Extract coverage percentage from lcov.info
            LINES=$(grep -o 'LF:[0-9]*' coverage/lcov.info | awk -F: '{sum+=$2} END {print sum}')
            LINES_HIT=$(grep -o 'LH:[0-9]*' coverage/lcov.info | awk -F: '{sum+=$2} END {print sum}')
            if [ "$LINES" -gt 0 ]; then
              COVERAGE=$(awk "BEGIN {printf \"%.2f\", ($LINES_HIT/$LINES)*100}")
              echo "COVERAGE_PERCENTAGE=$COVERAGE" >> $GITHUB_ENV
              echo "📊 Coverage: $COVERAGE%"
            fi
          fi

      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const coverage = process.env.COVERAGE_PERCENTAGE;
            if (coverage) {
              const body = `## 📊 Test Coverage Report\n\n**Coverage:** ${coverage}%\n\n✅ All tests passed!\n\nView detailed coverage report on [Codecov](https://codecov.io/gh/${{ github.repository }})`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Test Summary
        run: |
          echo "✅ All tests passed!"
          echo "📊 Coverage report uploaded to Codecov"

