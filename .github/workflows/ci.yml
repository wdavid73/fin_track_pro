name: Flutter CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 🔥 Cache Pub dependencies
      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      # 🔨 Generate code (Hive adapters, Injectable, etc.)
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify CI works without .env files
        run: |
          if [ -f .env ] || [ -f .env.dev ] || [ -f .env.staging ] || [ -f .env.prod ]; then
            echo "❌ .env files should not exist in CI"
            exit 1
          fi
          echo "✅ No .env files - using fallback values"

      # ⚡ Analyze sin pub get
      # Note: Warnings about missing .env files are expected and safe in CI
      - name: Analyze code
        run: flutter analyze --no-pub --suppress-analytics 2>&1 | grep -v "asset_does_not_exist" || flutter analyze --no-pub

      - name: Create empty env files
        run: |
          touch .env.dev
          touch .env.staging
          touch .env.prod

      # ⚡ Tests sin pub get
      - name: Run tests
        run: flutter test --no-pub --coverage

      # 🧹 Filter generated files from coverage report
      # Removes: Hive adapters (*.g.dart), l10n generated files,
      # injectable modules and other auto-generated code
      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Filter generated files from coverage
        run: |
          lcov \
            --remove coverage/lcov.info \
            '**/*.g.dart' \
            '**/*.freezed.dart' \
            '**/app_localizations*.dart' \
            '**/injection_container.dart' \
            '**/register_module.dart' \
            --output-file coverage/lcov.info \
            --ignore-errors unused,unused

      # 🚦 Coverage gate — fail CI if coverage drops below 60%
      - name: Check coverage threshold (≥ 60%)
        run: |
          LINES=$(grep -o 'LF:[0-9]*' coverage/lcov.info | awk -F: '{sum+=$2} END {print sum}')
          LINES_HIT=$(grep -o 'LH:[0-9]*' coverage/lcov.info | awk -F: '{sum+=$2} END {print sum}')
          if [ "$LINES" -gt 0 ]; then
            COVERAGE=$(awk "BEGIN {printf \"%.2f\", ($LINES_HIT/$LINES)*100}")
            echo "📊 Coverage (filtered): $COVERAGE%"
            PASS=$(awk "BEGIN {print ($COVERAGE >= 60.0) ? 1 : 0}")
            if [ "$PASS" -eq 0 ]; then
              echo "❌ Coverage $COVERAGE% is below the 60% threshold. Please add more tests."
              exit 1
            fi
            echo "✅ Coverage gate passed: $COVERAGE% >= 60%"
            echo "COVERAGE_PERCENTAGE=$COVERAGE" >> $GITHUB_ENV
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # 📊 PR Comment with coverage (emoji by threshold: 🟢 ≥80%, 🟡 ≥60%, 🔴 <60%)
      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const coverage = process.env.COVERAGE_PERCENTAGE;
            if (coverage) {
              const pct = parseFloat(coverage);
              const emoji = pct >= 80 ? '🟢' : pct >= 60 ? '🟡' : '🔴';
              const body = `## 📊 Test Coverage Report\n\n${emoji} **Coverage:** ${coverage}% (excl. generated files)\n\n✅ All tests passed!\n\nView detailed coverage report on [Codecov](https://codecov.io/gh/${{ github.repository }})`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Test Summary
        run: |
          echo "✅ All tests passed!"
          echo "📊 Coverage report uploaded to Codecov"

