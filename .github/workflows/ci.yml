name: Flutter CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Verify CI works without .env files
        run: |
          if [ -f .env ] || [ -f .env.dev ] || [ -f .env.staging ] || [ -f .env.prod ]; then
            echo "❌ .env files should not exist in CI"
            exit 1
          fi
          echo "✅ No .env files - using fallback values"
      
      - name: Analyze code
        run: flutter analyze
      
      - name: Run tests
        run: flutter test --coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Test Summary
        run: |
          echo "✅ All tests passed!"
          echo "📊 Coverage report generated"

