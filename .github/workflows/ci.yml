  integration_test_android:
    name: Patrol Integration Tests (Android)
    runs-on: ubuntu-latest
    needs: test # Solo corre si los unit tests pasan exitosamente

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli 4.2.0

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create empty env files
        run: |
          touch .env.dev
          touch .env.staging
          touch .env.prod

      - name: Build Patrol APKs
        run: patrol build android --target integration_test/smoke_test.dart --flavor dev

      # Autenticación en Google Cloud / Firebase
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'

      - name: Run tests on Firebase Test Lab
        run: |
          gcloud firebase test android run \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --type instrumentation \
            --app build/app/outputs/apk/dev/debug/app-dev-debug.apk \
            --test build/app/outputs/apk/androidTest/dev/debug/app-dev-debug-androidTest.apk \
            --timeout 5m \
            --use-orchestrator \
            --environment-variables clearPackageData=true \
            --device model=Pixel3,version=30,locale=es,orientation=portrait

