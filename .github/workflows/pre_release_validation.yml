name: Pre-Release Validation

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────
  # Job 1: Validate configuration consistency
  # ──────────────────────────────────────────
  validate-config:
    name: Validate Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create empty env files
        run: |
          touch .env.dev
          touch .env.staging
          touch .env.prod

      - name: Run release config validation
        run: dart run tools/validate_release_config.dart

  # ──────────────────────────────────────────
  # Job 2: Build check (compile + test)
  # ──────────────────────────────────────────
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: validate-config
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create empty env files
        run: |
          touch .env.dev
          touch .env.staging
          touch .env.prod

      - name: Analyze code
        run: flutter analyze --no-pub --suppress-analytics 2>&1 | grep -v "asset_does_not_exist" || flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build prod APK (release)
        run: flutter build apk --flavor prod -t lib/flavors/main_prod.dart --release

  # ──────────────────────────────────────────
  # Job 3: Security checks
  # ──────────────────────────────────────────
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded API keys
        run: |
          echo "Scanning lib/ for hardcoded API keys..."

          FOUND=false

          # Google API keys
          if grep -rn 'AIza[0-9A-Za-z_-]\{35\}' lib/ 2>/dev/null; then
            echo "FOUND: Possible Google API key"
            FOUND=true
          fi

          # OpenAI / Stripe secret keys
          if grep -rn 'sk-[a-zA-Z0-9]\{20,\}' lib/ 2>/dev/null; then
            echo "FOUND: Possible secret key (sk-)"
            FOUND=true
          fi

          # AWS Access Keys
          if grep -rn 'AKIA[0-9A-Z]\{16\}' lib/ 2>/dev/null; then
            echo "FOUND: Possible AWS Access Key"
            FOUND=true
          fi

          # GitHub tokens
          if grep -rn 'ghp_[a-zA-Z0-9]\{36\}' lib/ 2>/dev/null; then
            echo "FOUND: Possible GitHub token"
            FOUND=true
          fi

          if [ "$FOUND" = true ]; then
            echo ""
            echo "Hardcoded API keys detected! Remove them and use environment variables instead."
            exit 1
          fi

          echo "No hardcoded API keys found."

      - name: Check for placeholder values
        run: |
          echo "Scanning lib/ for placeholder values..."

          FOUND=false

          if grep -rni 'YOUR_API_KEY\|CHANGE_ME\|INSERT_.*_HERE' lib/ 2>/dev/null; then
            echo "FOUND: Placeholder values in source code"
            FOUND=true
          fi

          if [ "$FOUND" = true ]; then
            echo ""
            echo "Placeholder values detected! Replace them with proper configuration."
            exit 1
          fi

          echo "No placeholder values found."

      - name: Verify .env files are not in repository
        run: |
          echo "Checking that .env files are not committed..."

          FOUND=false

          for f in .env .env.dev .env.staging .env.prod; do
            if [ -f "$f" ]; then
              echo "FOUND: $f exists in repository (should be gitignored)"
              FOUND=true
            fi
          done

          if [ "$FOUND" = true ]; then
            echo ""
            echo "Environment files should not be committed. Add them to .gitignore."
            exit 1
          fi

          echo "No .env files found in repository (correct)."
